name: Publish GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build vitrine (production)
        env:
          APP_URL: ${{ vars.APP_URL }}
          PAGES_APP_URL: ${{ vars.PAGES_APP_URL }}
        run: VITRINE_OUT=site-output bash scripts/build-vitrine.sh

      - name: Deploy gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site-output
          publish_branch: gh-pages
          force_orphan: true
