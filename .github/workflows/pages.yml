name: Publish GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      app_url:
        description: "URL Laravel production (https://..., sans slash final)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build vitrine (production)
        env:
          APP_URL: ${{ inputs.app_url || vars.APP_URL }}
          PAGES_APP_URL: ${{ vars.PAGES_APP_URL }}
        run: VITRINE_OUT=site-output bash scripts/build-vitrine.sh

      - name: Verify production link
        run: |
          if grep -qE '^https?://' site-output/production-url 2>/dev/null; then
            echo "Lien production OK : $(grep -E '^https?://' site-output/production-url | head -1)"
          else
            echo "::warning::APP_URL absente — definis vars.APP_URL (Render) ou production-url"
          fi
          if grep -q 'href="connexion.html"' site-output/index.html && grep -qE '^https?://' site-output/production-url 2>/dev/null; then
            echo "::error::index.html non mis a jour malgre APP_URL"
            exit 1
          fi

      - name: Deploy gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site-output
          publish_branch: gh-pages
          force_orphan: true
