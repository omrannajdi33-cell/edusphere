<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <base href="/edusphere/" />
  <title>Connexion — EduSphere</title>
  <link rel="icon" href="../favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    body {
      margin: 0;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      font-family: "Outfit", system-ui, sans-serif;
      background: #f4f6fb;
      color: #0f172a;
      padding: 1.5rem;
      text-align: center;
    }
    .box {
      max-width: 30rem;
      background: #fff;
      border-radius: 1.25rem;
      padding: 2rem 1.5rem;
      box-shadow: 0 20px 50px rgba(15, 23, 42, 0.08);
    }
    h1 { margin: 0 0 0.75rem; font-size: 1.6rem; }
    p { margin: 0 0 1rem; color: #64748b; line-height: 1.6; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 3rem;
      padding: 0 1.25rem;
      border-radius: 999px;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: #fff;
      font-weight: 700;
      text-decoration: none;
    }
    .back {
      display: block;
      margin-top: 1rem;
      color: #4f46e5;
      font-weight: 600;
      text-decoration: none;
    }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div class="box" id="loading">
    <h1>Connexion</h1>
    <p>Ouverture de l'application EduSphere…</p>
  </div>
  <div class="box" id="pending" hidden>
    <h1>Application en ligne bientôt</h1>
    <p>L'espace professeur et élèves sera disponible dès que le serveur Laravel sera publié.</p>
    <p>En attendant, découvre le projet sur la page d'accueil.</p>
    <a class="back" href="../index.html">← Retour à l'accueil</a>
  </div>
  <script>
    (async function () {
      var invalid = /github\.io|gitlab\.io|localhost|127\.0\.0\.1/i;
      var url = "";
      try {
        var res = await fetch("../production-url", { cache: "no-store" });
        var raw = await res.text();
        url = raw.split("\n").map(function (l) { return l.trim(); }).find(function (l) {
          return l && l.charAt(0) !== "#";
        }) || "";
      } catch (e) {}
      if (url && !invalid.test(url)) {
        window.location.replace(url.replace(/\/$/, "") + "/connexion");
        return;
      }
      document.getElementById("loading").hidden = true;
      document.getElementById("pending").hidden = false;
    })();
  </script>
</body>
</html>
