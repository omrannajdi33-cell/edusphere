services:
  edusphere:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:8080
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/database/database.sqlite
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      SEED_DEMO: "true"
    volumes:
      - edusphere_data:/var/www/database
      - edusphere_storage:/var/www/storage

volumes:
  edusphere_data:
  edusphere_storage:
