<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#eef2ff" />
  <base href="/edusphere/" />
  <title>Connexion — EduSphere</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/edu.css" />
  <script>
    (function () {
      var app = "__APP_URL__".replace(/\/$/, "");
      if (app && /^https?:\/\//i.test(app) && app.indexOf("__APP") === -1) {
        location.replace(app + "/connexion");
      }
    })();
  </script>
</head>
<body class="edu-shell">
  <main class="edu-page">
    <div class="edu-wrap">
      <p class="edu-kicker">École d'été</p>
      <h1 class="edu-title">EduSphere</h1>
      <p class="edu-subtitle">Connecte-toi pour continuer</p>

      <div class="edu-glass">
        <p style="margin:0 0 1rem;color:#64748b;line-height:1.6;text-align:center;">
          L'application n'est pas encore liée à une URL de production.
          Définis la variable <strong>APP_URL</strong> dans GitHub (Settings → Variables) puis relance le déploiement Pages.
        </p>
        <a class="edu-btn-primary" href="index.html" style="text-decoration:none;">← Retour à l'accueil</a>
      </div>
    </div>
  </main>
</body>
</html>
