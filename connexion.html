<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <base href="/edusphere/" />
  <title>Connexion — EduSphere</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --muted: #64748b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      font-family: "Outfit", system-ui, sans-serif;
      background: #f4f6fb;
      color: #0f172a;
      padding: 1.5rem;
    }
    .box {
      width: min(28rem, 100%);
      background: #fff;
      border-radius: 1.25rem;
      padding: 2rem 1.5rem;
      box-shadow: 0 20px 50px rgba(15, 23, 42, 0.08);
      text-align: center;
    }
    .kicker {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--primary-dark);
      margin-bottom: 0.35rem;
    }
    h1 {
      margin: 0 0 0.5rem;
      font-size: 2rem;
      letter-spacing: -0.03em;
    }
    p { margin: 0 0 1rem; color: var(--muted); line-height: 1.6; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 3rem;
      padding: 0 1.35rem;
      border-radius: 999px;
      font-weight: 700;
      text-decoration: none;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #fff;
      box-shadow: 0 12px 28px rgba(79, 70, 229, 0.28);
    }
    .back {
      display: block;
      margin-top: 1rem;
      color: var(--primary-dark);
      font-weight: 600;
      text-decoration: none;
    }
    .note {
      margin-top: 1rem;
      font-size: 0.88rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="box">
    <p class="kicker">École d'été</p>
    <h1>EduSphere</h1>
    <p>GitHub Pages affiche la vitrine du projet. La connexion réelle passe par l'application Laravel (PHP).</p>
    <a class="btn" href="http://127.0.0.1:8000/connexion">Ouvrir la connexion (local)</a>
    <p class="note">Lance d'abord : <code>php artisan serve</code> dans le dossier du projet.</p>
    <a class="back" href="index.html">← Retour à l'accueil</a>
  </div>
</body>
</html>
