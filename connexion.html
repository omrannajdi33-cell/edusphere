<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#eef2ff" />
  <base href="/edusphere/" />
  <title>Connexion — EduSphere</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/edu.css" />
</head>
<body class="edu-shell">
  <main class="edu-page">
    <div class="edu-wrap">
      <p class="edu-kicker">École d'été</p>
      <h1 class="edu-title">EduSphere</h1>
      <p class="edu-subtitle">Connecte-toi pour continuer</p>

      <form id="login-form" class="edu-glass">
        <div class="edu-field">
          <label class="edu-label" for="login">Identifiant</label>
          <input id="login" class="edu-input" type="text" name="login" required autofocus autocomplete="username" />
        </div>

        <div class="edu-field">
          <label class="edu-label" for="password">Mot de passe</label>
          <input id="password" class="edu-input" type="password" name="password" required autocomplete="current-password" />
        </div>

        <label class="edu-check">
          <input type="checkbox" name="remember" />
          Se souvenir de moi
        </label>

        <button type="submit" class="edu-btn-primary">Entrer</button>
      </form>

      <a class="edu-link" href="index.html">← Retour à l'accueil</a>
    </div>
  </main>
  <script>
    (function () {
      var invalid = /github\.io|gitlab\.io/i;
      var form = document.getElementById("login-form");
      var appUrl = "http://127.0.0.1:8000";

      function parseUrl(raw) {
        if (!raw) return "";
        var line = raw.split("\n").map(function (l) { return l.trim(); }).find(function (l) {
          return l && l.charAt(0) !== "#" && /^https?:\/\//i.test(l);
        });
        if (!line || invalid.test(line)) return "";
        return line.replace(/\/$/, "");
      }

      fetch("production-url", { cache: "no-store" })
        .then(function (r) { return r.ok ? r.text() : ""; })
        .then(function (raw) {
          var fromFile = parseUrl(raw);
          if (fromFile) appUrl = fromFile;
        })
        .catch(function () {})
        .finally(function () {
          form.addEventListener("submit", function (e) {
            e.preventDefault();
            window.location.href = appUrl + "/connexion";
          });
        });
    })();
  </script>
</body>
</html>
