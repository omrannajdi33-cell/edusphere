# EduSphere — GitLab CI/CD

stages:
  - test
  - build
  - deploy

variables:
  COMPOSER_CACHE_DIR: .composer-cache

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - vendor/
    - node_modules/
    - .composer-cache/

# ── Tests Laravel ─────────────────────────────────────────────
test:php:
  stage: test
  image: php:8.3-cli
  variables:
    APP_ENV: testing
    DB_CONNECTION: sqlite
    DB_DATABASE: database/database.sqlite
    CACHE_STORE: array
    SESSION_DRIVER: array
    QUEUE_CONNECTION: sync
  before_script:
    - apt-get update -qq && apt-get install -y -qq git unzip libzip-dev libsqlite3-dev
    - docker-php-ext-install pdo pdo_sqlite zip
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
    - cp .env.example .env
    - composer install --prefer-dist --no-interaction --no-progress
    - php artisan key:generate --force
    - mkdir -p database && touch database/database.sqlite
    - php artisan migrate --force --no-interaction
  script:
    - php artisan test
  only:
    - main
    - merge_requests

# ── Build assets (Vite + pdf.js) ────────────────────────────
build:assets:
  stage: build
  image: node:22-alpine
  before_script:
    - npm ci
  script:
    - npm run build
  artifacts:
    expire_in: 1 week
    paths:
      - public/build/
  only:
    - main
    - merge_requests

# ── Déploiement manuel (serveur VPS / hébergeur SSH) ──────────
# Variables à configurer dans GitLab → Settings → CI/CD → Variables :
#   SSH_PRIVATE_KEY  (masked) — clé privée SSH
#   DEPLOY_HOST        — ex. 123.45.67.89 ou edusphere.example.com
#   DEPLOY_USER        — ex. deploy ou root
#   DEPLOY_PATH        — ex. /var/www/edusphere
deploy:production:
  stage: deploy
  image: alpine:3.21
  needs:
    - job: test:php
    - job: build:assets
      artifacts: true
  before_script:
    - apk add --no-cache openssh-client rsync bash
    - eval "$(ssh-agent -s)"
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
  script:
    - rsync -az --delete --exclude .git --exclude .env --exclude node_modules --exclude vendor --exclude "storage/logs/*" --exclude "storage/framework/cache/*" --exclude "storage/framework/sessions/*" --exclude "storage/framework/views/*" ./ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
    - ssh "$DEPLOY_USER@$DEPLOY_HOST" "cd $DEPLOY_PATH && bash deploy/deploy.sh"
  environment:
    name: production
    url: $APP_URL
  when: manual
  only:
    - main
